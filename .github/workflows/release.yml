# Builds StuntCopter for macOS (universal, Developer ID–signed, notarized) and
# Windows (x64), and publishes both zips.
#   - Push a tag like v1.1.0 → a GitHub Release with both zips.
#   - Run manually (Actions ▸ Release ▸ Run workflow) → the zips as build artifacts.
#
# Repository secrets (macOS signing):
#   MACOS_CERTIFICATE_P12       base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD  its password
#   NOTARY_KEY_P8               base64 of the App Store Connect API key (.p8)
#   NOTARY_KEY_ID               the key's ID
#   NOTARY_ISSUER_ID            the App Store Connect issuer UUID
# Repository secrets (Windows signing with Azure Artifact Signing; the signing steps
# are skipped while AZURE_CLIENT_ID is unset, leaving the exe unsigned):
#   AZURE_TENANT_ID             Entra tenant of the app registration
#   AZURE_CLIENT_ID             app registration with a federated credential for this
#                               repo (OIDC) and the "Artifact Signing Certificate
#                               Profile Signer" role on the certificate profile
#   ARTIFACT_SIGNING_ENDPOINT   e.g. https://eus.codesigning.azure.net (the account's region)
#   ARTIFACT_SIGNING_ACCOUNT    the Artifact Signing account name
#   ARTIFACT_SIGNING_PROFILE    the Public Trust certificate profile name
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build, sign, notarize
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          make release NOTARY_ARGS="--key $RUNNER_TEMP/AuthKey.p8 --key-id $NOTARY_KEY_ID --issuer $NOTARY_ISSUER_ID"
          rm "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: StuntCopter-macOS
          path: build/StuntCopter-*.zip

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  windows:
    runs-on: windows-latest
    # The OIDC token's subject is then repo:<owner>/<repo>:environment:release for
    # every run (tag or manual), so one federated credential covers all releases.
    environment: release
    permissions:
      contents: read
      id-token: write   # OIDC login to Azure for signing
    env:
      SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}   # `secrets` can't be used in a step `if`
    steps:
      - uses: actions/checkout@v5

      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.1-release
          swift-build: 6.1-RELEASE

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build
        id: build
        shell: pwsh
        run: |
          swift build -c release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "bin=$((swift build -c release --show-bin-path).Trim())" >> $env:GITHUB_OUTPUT

      - name: Azure login
        if: env.SIGNING == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          # No subscription: the app's only role is on the certificate profile, and
          # signing needs just the token.
          allow-no-subscriptions: true

      - name: Sign
        if: env.SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ steps.build.outputs.bin }}
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # The exe plus the Swift runtime DLLs it loads (Foundation, ICU, concurrency…),
      # so it runs on a machine without Swift installed.
      - name: Package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v(.+)$') { $Matches[1] } else { 'dev' }
          $bin = "${{ steps.build.outputs.bin }}"
          Get-AuthenticodeSignature "$bin\StuntCopter.exe" | Format-List Status, StatusMessage, SignerCertificate
          $out = "build\StuntCopter-$version-windows-x64"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item "$bin\StuntCopter.exe" $out
          # The installer puts the runtime under %LOCALAPPDATA%\Programs\Swift (per-user)
          # or %ProgramFiles%\Swift (all users); the toolchain's own bin is a fallback.
          $roots = @("$env:LOCALAPPDATA\Programs\Swift\Runtimes", "$env:ProgramFiles\Swift\Runtimes",
                     (Split-Path (Get-Command swift).Source)) | Where-Object { Test-Path $_ }
          $core = $roots | ForEach-Object { Get-ChildItem -Recurse $_ -Filter swiftCore.dll } | Select-Object -First 1
          if (-not $core) { throw "Swift runtime DLLs not found" }
          Write-Host "Runtime DLLs from $($core.DirectoryName)"
          Copy-Item "$($core.DirectoryName)\*.dll" $out
          $vcr = Get-ChildItem -Recurse "$env:VCToolsRedistDir" -Filter vcruntime140.dll -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if ($vcr) { Copy-Item $vcr.FullName $out }
          Get-ChildItem $out | Format-Table Name, Length
          Compress-Archive -Path "$out\*" -DestinationPath "$out.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: StuntCopter-Windows
          path: build/StuntCopter-*-windows-x64.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/StuntCopter-*.zip \
            --title "StuntCopter 1.5, $GITHUB_REF_NAME" \
            --notes "Duane Blehm's StuntCopter 1.5 (1987), ported to modern systems.

          - **macOS**: universal (Apple silicon and Intel) build for macOS 14 or later, signed and notarized. Unzip and open StuntCopter.app.
          - **Windows**: x64 build for Windows 10 or later, code-signed. Unzip the folder and run StuntCopter.exe."
