# Builds StuntCopter for macOS (universal, Developer ID–signed, notarized) and
# Windows (x64), and publishes both zips.
#   - Push a tag like v1.1.0 → a GitHub Release with both zips.
#   - Run manually (Actions ▸ Release ▸ Run workflow) → the zips as build artifacts.
#
# Repository secrets (macOS signing):
#   MACOS_CERTIFICATE_P12       base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD  its password
#   NOTARY_KEY_P8               base64 of the App Store Connect API key (.p8)
#   NOTARY_KEY_ID               the key's ID
#   NOTARY_ISSUER_ID            the App Store Connect issuer UUID
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build, sign, notarize
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          make release NOTARY_ARGS="--key $RUNNER_TEMP/AuthKey.p8 --key-id $NOTARY_KEY_ID --issuer $NOTARY_ISSUER_ID"
          rm "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: StuntCopter-macOS
          path: build/StuntCopter-*.zip

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.1-release
          swift-build: 6.1-RELEASE

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build
        run: swift build -c release

      # The exe plus the Swift runtime DLLs it loads (Foundation, ICU, concurrency…),
      # so it runs on a machine without Swift installed. Unsigned: SmartScreen will
      # warn about an unknown publisher.
      - name: Package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v(.+)$') { $Matches[1] } else { 'dev' }
          $bin = (swift build -c release --show-bin-path).Trim()
          $out = "build\StuntCopter-$version-windows-x64"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item "$bin\StuntCopter.exe" $out
          $core = Get-ChildItem -Recurse "$env:ProgramFiles\Swift\Runtimes" -Filter swiftCore.dll | Select-Object -First 1
          if (-not $core) { throw "Swift runtime DLLs not found" }
          Copy-Item "$($core.DirectoryName)\*.dll" $out
          $vcr = Get-ChildItem -Recurse "$env:VCToolsRedistDir" -Filter vcruntime140.dll -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if ($vcr) { Copy-Item $vcr.FullName $out }
          Get-ChildItem $out | Format-Table Name, Length
          Compress-Archive -Path "$out\*" -DestinationPath "$out.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: StuntCopter-Windows
          path: build/StuntCopter-*-windows-x64.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/StuntCopter-*.zip \
            --title "StuntCopter 1.5, $GITHUB_REF_NAME" \
            --notes "Duane Blehm's StuntCopter 1.5 (1987), ported to modern systems.

          - **macOS**: universal (Apple silicon and Intel) build for macOS 14 or later, signed and notarized. Unzip and open StuntCopter.app.
          - **Windows**: x64 build for Windows 10 or later. Unzip the folder and run StuntCopter.exe (it is not code-signed, so SmartScreen will ask you to confirm)."
