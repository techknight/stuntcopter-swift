# Builds and tests every push and pull request on both platforms.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]   # tags go through release.yml
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test
      - name: Build the app
        run: make app

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.1-release
          swift-build: 6.1-RELEASE
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test
      - name: Build the app
        run: swift build -c release
